{% extends "academy/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}

<div class="hero"><h1>Log in</h1></div>

<form class="card" method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-gold" type="submit">Log in</button>
  <input type="hidden" name="next" value="{{ next }}">
</form>
<p>New here? <a href="{% url 'academy:signup' %}">Create an account</a></p>

{% endblock %}
